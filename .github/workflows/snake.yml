name: Generate Snake

on:
  push:
    branches: [main]        # запустится сразу при коммите
  schedule:
    - cron: "0 */12 * * *"  # и дальше два раза в сутки
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs (light + dark, brand colors)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0F6E56&color_dots=#ebedf0,#c6e6d9,#7fc9a9,#3fa77e,#0F6E56
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D85A30

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
